services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: circle
      POSTGRES_USER: circle
      POSTGRES_PASSWORD: circle
    ports:
      - "5434:5432"
    volumes:
      - circle-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circle -d circle"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run db:migrate && bun dev"
    # .env.local supplies the secret and dev-login vars; DATABASE_URL below wins
    # over it because `environment` takes precedence over `env_file`.
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://circle:circle@db:5432/circle
      BETTER_AUTH_URL: http://localhost:3002
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      # anonymous volume so the container's linux node_modules never overwrite
      # (or get overwritten by) the host's
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  circle-pgdata:
