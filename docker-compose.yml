# Postgres only. The app runs on the host (`bun run dev`) — there was an `app` service
# here, but Next.js 16 + Turbopack cannot resolve the `pg` server-external package under
# the Bun runtime, so it 500'd on every database-backed page. Rather than keep a service
# that only ever produced a broken second way to run the app, it is gone.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: circle
      POSTGRES_USER: circle
      POSTGRES_PASSWORD: circle
    ports:
      - "5434:5432"
    volumes:
      - circle-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circle -d circle"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  circle-pgdata:
