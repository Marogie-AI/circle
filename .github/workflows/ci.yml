name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    # The lib/queries tests hit a real database — they assert on SQL behaviour
    # (keyset predicates, cascade deletes, index-backed counts), which a mock
    # cannot check. A service container is cheaper and safer than a Neon branch:
    # no credentials exposed to fork PRs, nothing to clean up afterwards.
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: circle
          POSTGRES_USER: circle
          POSTGRES_PASSWORD: circle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U circle -d circle"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # apps/web's test script passes --env-file=.env.local, which is absent here.
      # bun treats a missing env file as a no-op, so these values win.
      DATABASE_URL: postgres://circle:circle@localhost:5432/circle
      BETTER_AUTH_URL: http://localhost:3002

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Pinned, not inherited. `next build` runs under Node even when bun drives the
      # script, so an unpinned runner default silently decides which Node compiled the
      # thing you ship. 24 matches what Vercel runs.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.18.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Generate ephemeral auth secret
        shell: bash
        run: |
          value="$(openssl rand -base64 48)"
          echo "::add-mask::$value"
          echo "BETTER_AUTH_SECRET=$value" >> "$GITHUB_ENV"

      - run: node --version && bun --version

      - run: bun install --frozen-lockfile
      - run: bun audit

      # drizzle/ is the only source of schema truth; the tests need the tables.
      - run: bun run db:migrate

      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
