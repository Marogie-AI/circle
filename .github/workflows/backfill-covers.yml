name: backfill covers

# Manual only. This mutates production rows and makes outbound requests to Openverse,
# so it must never fire on a push.
#
# It exists because PROD_DATABASE_URL cannot be read out of GitHub — secrets are
# write-only — and it should not be copied onto anyone's laptop. Running here keeps the
# credential inside Actions, where it is also masked in the logs.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the database. Leave false for a dry run first."
        type: boolean
        default: false
      limit:
        description: "Maximum posts to process in one run."
        type: string
        default: "200"
      group:
        description: "Optional group slug, to backfill just one group."
        type: string
        default: ""

permissions:
  contents: read

# One at a time: two concurrent runs would race on the same rows and double the
# outbound request rate.
concurrency:
  group: backfill-covers
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Backfill covers
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          bun scripts/backfill-covers.ts \
            ${{ inputs.apply && '--apply' || '' }} \
            --limit "${{ inputs.limit }}" \
            ${{ inputs.group && format('--group {0}', inputs.group) || '' }}
